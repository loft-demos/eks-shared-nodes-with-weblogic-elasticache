{{- if .Values.ancillaryServices.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wi-ancillary-status
  namespace: {{ include "weblogic-demo.namespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: wi-ancillary-status
    app.kubernetes.io/part-of: weblogic-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wi-ancillary-status
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wi-ancillary-status
        app.kubernetes.io/part-of: weblogic-demo
    spec:
      containers:
        - name: status
          image: {{ .Values.ancillaryServices.image | quote }}
          ports:
            - name: http
              containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: wi-ancillary-status
  namespace: {{ include "weblogic-demo.namespace" . }}
  labels:
    app.kubernetes.io/name: wi-ancillary-status
    app.kubernetes.io/part-of: weblogic-demo
spec:
  selector:
    app.kubernetes.io/name: wi-ancillary-status
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
