namespace: wi
domainUID: wi-domain
managedServerCount: 3

credentialsSecretName: wi-domain-credentials
runtimeEncryptionSecretName: wi-domain-runtime-encryption-secret

demoCredentials:
  create: true
  username: weblogic
  password: welcome1

demoRuntimeEncryption:
  create: true
  password: welcome1-runtime-encryption

domain:
  # Oracle Container Registry GA image. Free for development, testing, prototyping and
  # demonstration under Oracle's terms once you have accepted them with an Oracle SSO;
  # use a CPU or patched image for anything production-like.
  #
  # 14.1.2.0 rather than 15.1.1.0 because the demo WAR imports javax.servlet.*; 15c is
  # the Jakarta EE 9.1 line and would need the servlets migrated to jakarta.servlet.*.
  image: container-registry.oracle.com/middleware/weblogic:14.1.2.0-generic-jdk17-ol8
  imagePullPolicy: IfNotPresent
  imagePullSecrets:
    # Must exist in the tenant's backing namespace, where the operator creates the pods.
    - name: ocr-pull-secret
  javaOptions: "-Dweblogic.StdoutDebugEnabled=false"
  auxiliaryImages:
    # Demo-owned: WDT model, WebLogic Deploy Tooling, and the demo WAR. Contains no
    # WebLogic Server, which is why it can be published publicly. Built multi-arch
    # (amd64 + arm64) by scripts/build-aux-image.sh.
    - image: ghcr.io/loft-demos/vcluster-weblogic-demo-aux:0.2.3
      imagePullPolicy: IfNotPresent

# Identity of the tenant cluster this domain belongs to, injected by the tenant cluster
# template. Surfaced on the demo page and /health so a screen share, or a curl across
# several tenants, is self-identifying. Both are optional: left empty, the page simply
# omits the rows.
tenant:
  name: ""
  # Namespace on the Control Plane Cluster where the shared operator actually creates
  # these pods. Worth showing: the developer only ever sees the tenant's own namespace.
  hostNamespace: ""

cluster:
  name: cluster-1
  servicePort: 8001

demoApp:
  enabled: true
  # Must match <context-root> in demo-webapp/src/main/webapp/WEB-INF/weblogic.xml.
  contextPath: /demo

httpRoute:
  # Off by default. A tenant-side HTTPRoute cannot reference the WebLogic cluster Service:
  # the operator creates that Service on the Control Plane Cluster and vCluster syncs it
  # down, so it is host-owned and backendRef translation fails with "not managed by
  # vCluster". The tenant template creates the route in the backing namespace instead.
  #
  # Turn this on only to route to an ordinary tenant Deployment, such as
  # ancillaryServices, where the Service really is tenant-owned.
  enabled: false
  name: wi-app
  host: wi-clienta-uat.apps.example.com
  parentRef:
    name: shared-gw
    namespace: envoy-gateway-system

ancillaryServices:
  # Optional mixed-workload demo only. Leave disabled when the WebLogic WAR is
  # the app being routed and observed.
  enabled: false
  image: public.ecr.aws/nginx/nginx-unprivileged:1.27-alpine

redisClearJob:
  # Real cache-clear job when elasticache.enabled is true, no-op otherwise.
  enabled: true
  image: public.ecr.aws/docker/library/redis:7-alpine

# Where the ElastiCache endpoint ConfigMap is mounted into WebLogic server pods and
# the cache-clear job. The demo servlet reads it from here on every request.
cacheMountPath: /u01/cache-config

cachePublisher:
  # Copies the ACK ReplicationGroup status endpoint into the ConfigMap above.
  # Only rendered when elasticache.enabled is also true.
  enabled: true
  image: public.ecr.aws/docker/library/python:3.12-alpine
  intervalSeconds: 15

cache:
  # How this tenant gets its Redis:
  #
  #   elasticache  Real AWS ElastiCache via an ACK ReplicationGroup. The self-service
  #                story, but AWS takes 5-10 minutes to provision one.
  #   in-tenant    A Redis pod inside the tenant cluster. Ready in seconds, works on any
  #                Control Plane Cluster including the home lab, and needs no AWS at all.
  #   none         No cache. The demo app reports "cache is still provisioning".
  #
  # The application is identical either way: both modes publish into the same endpoint
  # ConfigMap, so the servlet neither knows nor cares which one it is talking to.
  mode: elasticache

inTenantCache:
  image: public.ecr.aws/docker/library/redis:7-alpine
  # No persistence and no TLS. This is a demo cache, and keeping it plaintext means the
  # servlet takes the same code path it does against ElastiCache with encryption off.
  maxMemory: 128mb

elasticache:
  # EKS only. Requires the ACK ElastiCache controller and the
  # replicationgroups.elasticache.services.k8s.aws CRD on the Control Plane Cluster
  # before the tenant cluster starts. Only used when cache.mode is "elasticache".
  replicationGroupID: ""      # defaults to <domainUID>-cache
  description: Demo Redis OSS replication group
  engine: redis
  engineVersion: "7.1"
  cacheNodeType: cache.t4g.micro
  # numNodeGroups: 1 plus replicasPerNodeGroup is ACK's cluster-mode-disabled shape.
  numNodeGroups: 1
  replicasPerNodeGroup: 0
  automaticFailoverEnabled: true
  multiAZEnabled: true
  port: 6379
  atRestEncryptionEnabled: true
  # TLS to ElastiCache uses a publicly trusted Amazon CA, so the JDK truststore validates
  # it with no extra configuration. Set to false only if TLS is getting in the way of a
  # live run; the demo servlet and the cache-clear job both follow this value.
  transitEncryptionEnabled: true
  cacheSubnetGroupName: ""
  securityGroupIDs: []
  extraTags: {}
