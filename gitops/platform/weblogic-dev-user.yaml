apiVersion: management.loft.sh/v1
kind: User
metadata:
  name: weblogic-tenant-a
spec:
  # Required, and the API only says "spec.subject: Required value" without saying what
  # belongs in it. For a local user it is the login identity, same as username; for an
  # SSO user it is the subject the identity provider asserts.
  subject: weblogic-dev-a
  username: weblogic-dev-a
  displayName: WebLogic Dev A
  owner:
    team: loft-admins
  access:
    - name: loft-access
      verbs:
        - get
        - bind
        - create
        - deletekey
        - getkey
        - updatekey
        - createkey
      subresources:
        - accesskeys
        - clusters
        - profile
        - permissions
        - object-permissions
      users:
        # The User's metadata.name, NOT its username. The Platform rewrites this field to
        # the object name on write, so anything else drifts immediately and Argo CD
        # self-heal fights it on every sync. Invisible on the built-in admin user, whose
        # name and username happen to be the same.
        - weblogic-tenant-a
