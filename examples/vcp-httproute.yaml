# Exposes the vCluster Platform UI through the same shared Envoy Gateway and the same
# wildcard certificate the tenant apps use. No separate ingress stack, no second cert.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vcluster-platform
  namespace: vcluster-platform
spec:
  parentRefs:
    - name: shared-gw
      namespace: envoy-gateway-system
  hostnames:
    - platform.example.com
  rules:
    - backendRefs:
        - name: loft
          port: 80
