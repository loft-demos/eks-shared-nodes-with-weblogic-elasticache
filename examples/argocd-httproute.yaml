# Exposes the Argo CD UI through the shared Envoy Gateway on the same wildcard
# certificate as the Platform and the tenant apps.
#
# Backend is the plain-HTTP port 80 on argocd-server, which only works because
# argocd-values.yaml sets configs.params."server.insecure": true. Against a default
# Argo CD install this route would redirect-loop, since the server would 301 every
# HTTP request to HTTPS while Envoy keeps sending it HTTP.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: shared-gw
      namespace: envoy-gateway-system
  hostnames:
    - argocd.example.com
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
